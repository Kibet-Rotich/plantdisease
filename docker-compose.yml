services:
  backend:
    build: ./backend
    image: agriguard-backend:latest
    restart: always
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models

  load_balancer:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend